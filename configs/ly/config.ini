# Ly display manager config (legacy ini format)
# Tomorrow Night Eighties theme

animation = none

# 0xSSRRGGBB - Tomorrow Night Eighties palette
# bg: #2d2d2d  fg: #cccccc  border: #ffcc66 (yellow accent)
bg = 0x002d2d2d
fg = 0x00cccccc
border_fg = 0x00ffcc66

box_title = Sectly's Shell
asterisk = *

clock = %H:%M  %a %d %b

tty = 2
shell = false
